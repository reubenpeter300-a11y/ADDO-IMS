name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Tengeneza folda la Android
        run: flutter create . --platforms=android
      - name: Lazimisha SDK 36 Kila Mahali
        run: |
          echo "1. Inarekebisha vifurushi (pub-cache)..."
          find ~/.pub-cache -type f -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g'
          find ~/.pub-cache -type f -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/compileSdk = 34/compileSdk = 36/g'
          
          echo "2. Inarekebisha mradi wako..."
          find android -type f -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g'
          find android -type f -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g'
      - name: Pakua Vifurushi
        run: flutter pub get
      - name: Jenga APK
        run: flutter build apk --release
      - name: Hifadhi APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
