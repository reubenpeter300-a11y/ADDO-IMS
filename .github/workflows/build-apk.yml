name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Tengeneza folda la Android
        run: flutter create . --platforms=android
      - name: Pakua Vifurushi
        run: flutter pub get
      - name: Rekebisha SDK na Kotlin kwenye vifurushi
        run: |
          echo "Inarekebisha compileSdk..."
          find ~/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' {} +
          find ~/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdk = 34/compileSdk = 36/g' {} +
          find . -type f -name "build.gradle*" -exec sed -i 's/flutter.compileSdkVersion/36/g' {} +
          echo "Inazima mfumo mpya wa Kotlin..."
          echo "android.builtInKotlin=false" >> android/gradle.properties
          echo "Imerekebishwa kikamilifu!"
      - name: Jenga APK
        run: flutter build apk --release
      - name: Nakili APK kwa mkono
        run: |
          echo "Inatafuta APK..."
          find . -name "*.apk" -type f
          cp $(find . -name "app-release.apk" | head -n 1) build/app/outputs/flutter-apk/app-release.apk || true
          cp $(find . -name "app-release.apk" | head -n 1) build/app/outputs/apk/release/app-release.apk || true
      - name: Hifadhi APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/apk/release/app-release.apk
