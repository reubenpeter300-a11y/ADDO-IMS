name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Rekebisha jina kwenye pubspec
        run: sed -i 's/^name: .*/name: addo_ims/' pubspec.yaml
      - name: Tengeneza folda la Android kwa jina sahihi
        run: flutter create . --project-name addo_ims --platforms=android
      - name: Pakua Vifurushi
        run: flutter pub get
      - name: Jenga APK
        run: flutter build apk --release
      - name: Hifadhi APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
