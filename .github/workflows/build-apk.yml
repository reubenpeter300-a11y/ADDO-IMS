name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Tengeneza folda la Android
        run: flutter create . --platforms=android
      - name: Lazimisha SDK 36 kwenye module zote
        run: |
          echo "Inarekebisha android/build.gradle..."
          echo "" >> android/build.gradle
          echo "subprojects {" >> android/build.gradle
          echo "    afterEvaluate { project ->" >> android/build.gradle
          echo "        if (project.hasProperty('android')) {" >> android/build.gradle
          echo "            project.android {" >> android/build.gradle
          echo "                if (namespace == null) {" >> android/build.gradle
          echo "                    namespace project.group" >> android/build.gradle
          echo "                }" >> android/build.gradle
          echo "                compileSdkVersion 36" >> android/build.gradle
          echo "            }" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle
          echo "Imerekebishwa kikamilifu!"
      - name: Pakua Vifurushi
        run: flutter pub get
      - name: Jenga APK
        run: flutter build apk --release
      - name: Hifadhi APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
