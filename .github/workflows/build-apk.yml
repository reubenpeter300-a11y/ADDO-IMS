name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Tengeneza folda la Android
        run: flutter create . --platforms=android
      - name: Pakua Vifurushi
        run: flutter pub get
      - name: Rekebisha file_picker kwa AGP 9
        run: |
          echo "Inarekebisha file_picker build.gradle..."
          find ~/.pub-cache -path "*file_picker*" -name "build.gradle" -exec sed -i 's/if (!isAgp9OrAbove)/if (isAgp9OrAbove)/' {} +
          echo "Imerekebishwa!"
      - name: Jenga APK
        run: flutter build apk --release
      - name: Hifadhi APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
