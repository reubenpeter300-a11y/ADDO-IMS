name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Tengeneza folda la Android
        run: flutter create . --platforms=android
      - name: Rekebisha compileSdk kwenye faili zote za Gradle
        run: |
          echo "Inatafuta na kurekebisha faili za Gradle..."
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i 's/flutter.compileSdkVersion/36/g; s/compileSdkVersion.*/compileSdkVersion 36/g; s/compileSdk = .*/compileSdk = 36/g'
          echo "Imerekebishwa kikamilifu!"
      - name: Pakua Vifurushi
        run: flutter pub get
      - name: Jenga APK
        run: flutter build apk --release
      - name: Hifadhi APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
