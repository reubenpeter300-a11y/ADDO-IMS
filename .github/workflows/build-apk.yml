name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Tengeneza folda la Android
        run: flutter create . --platforms=android
      - name: Lazimisha SDK 36 kwa plugins zote
        run: |
          echo "Inaandika sheria mpya kwenye android/build.gradle..."
          cat << 'INNER_EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                          compileSdkVersion 36
                      }
                  }
              }
          }
          INNER_EOF
          echo "Imerekebishwa kikamilifu!"
      - name: Pakua Vifurushi
        run: flutter pub get
      - name: Jenga APK
        run: flutter build apk --release
      - name: Hifadhi APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
